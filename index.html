<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛博皮影戏 · Cyber Shadow Play</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<canvas id="stage"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>

<header id="hud-top">
  <h1>赛博皮影戏</h1>
  <span class="sub">CYBER SHADOW PLAY · 以手为杆 · 以光为幕</span>
  <button id="btn-bgm">♫ 音乐·开</button>
</header>

<div id="hud-bottom">
  <div id="hand-tip">未见手势 · 请将手举到摄像头前（距离 30~50cm，光线充足更易识别）</div>
  <div class="legend">
    <span>✊ 握拳 · 斩</span>
    <span>🖐 张掌 · 术</span>
    <span>🤏 捏合 · 弹</span>
    <span>✌️ 双指 · 书</span>
    <span>🤟 摇滚 · 雷</span>
    <span>3️⃣ 三指 · 扇</span>
    <span>👍 竖拇指 · 揖</span>
    <span>👌 OK · 印</span>
    <span>✊✊ 双拳 · 合斩</span>
    <span>🙌 双掌 · 合璧</span>
  </div>
  <div id="status">等待开场……</div>
</div>

<div id="overlay">
  <div class="panel">
    <h2>赛博皮影戏</h2>
    <p>站到摄像头前，抬起手，你就是执杆人。</p>
    <p class="hint">✊ 出斩 · 🖐 施术 · 🤏 蓄弹 · ✌️ 题字 · 👌 结印 · 🙌 双掌合璧</p>
    <p class="tip">新手提示：手离摄像头 30~50cm，光线充足、手心朝镜头更易识别</p>
    <button id="btn-start">开 启 皮 影 戏</button>
    <p id="overlay-msg"></p>
  </div>
</div>

<video id="video" playsinline></video>

<script src="js/effects.js"></script>
<script src="js/gestures.js"></script>
<script src="js/puppet.js"></script>
<script src="js/main.js"></script>
</body>
</html>
